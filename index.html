<style>
:root{
  --bg:#f6f4ef; --paper:#fcfbf8; --ink:#1d1d1b; --sub:#57554f; --faint:#8c8a84; --line:#e5e1d8; --wash:#eeebe4; --wash2:#e6e2da; --inv:#ffffff;
  --glass:rgba(246,244,239,.94); --glass-l:rgba(252,251,248,.5); --glass-p:rgba(252,251,248,.66); --hov:rgba(0,0,0,.06); --hov2:rgba(0,0,0,.11);
  --accent:#111111; --accent-soft:#f2f2f0; --warn:#9a6a1f; --warn-soft:#faf5ec; --ok:#3d6b47;
  --radius:0px; --nav:76px;
  --serif:"Cormorant Garamond","Noto Serif JP",serif; --sans:"Inter","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 19px/1.75 var(--sans);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.3}
.hidden{display:none!important}
.eyebrow{font:500 13px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--sub)}

/* ヘッダー */
header{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(8px);padding:20px 20px 0;border-bottom:1px solid var(--line);transition:transform .28s ease}
header.tuck{transform:translateY(calc(-100% - 4px));border-bottom-color:transparent}
header,header#top{border-bottom:0!important}
@media(min-width:420px){br.sp{display:none}}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;max-width:1200px;margin:0 auto}
.brand h1{font-size:22px;min-width:0;letter-spacing:.02em;font-weight:500}
.brand h1 small{display:block;font:500 12px/1.6 var(--sans);color:var(--sub);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;white-space:nowrap}
.linkbtn{flex:none;white-space:nowrap;background:none;border:0;color:var(--sub);font-size:15px;letter-spacing:.08em;padding:8px 0;border-bottom:1px solid transparent}
.linkbtn:hover{color:var(--ink);border-color:var(--ink)}
#finder{max-width:1200px;margin:0 auto}
.search{margin-top:16px}
.search input{width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;font-size:20px;-webkit-appearance:none}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none}
.search{position:relative}
.search input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .sclr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--faint);color:var(--bg);font-size:15px;font-weight:700;line-height:1;display:none;align-items:center;justify-content:center;padding:0;cursor:pointer}
.search.has .sclr{display:flex}
.search.has input{padding-right:46px}
.chips{display:flex;gap:22px;overflow-x:auto;padding:14px 0 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:none;padding:6px 0 12px;font-size:17px;color:var(--sub);white-space:nowrap;border-bottom:2px solid transparent;border-radius:0}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--sub);padding:10px 0 12px;letter-spacing:.04em;border-top:1px solid var(--line)}
.meta select{border:0;background:none;font-size:15px;color:var(--sub);padding:4px 0;-webkit-appearance:none;text-align:right}

main{padding:28px 20px calc(var(--nav) + 40px);max-width:1200px;margin:0 auto}

/* アルバム */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 18px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 32px}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:block;width:100%;background:none;border:0;padding:0;text-align:left;border-radius:0;align-self:start;vertical-align:top}
.tile .ph{aspect-ratio:4/5;background:var(--wash);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:14px;letter-spacing:.1em;overflow:hidden;padding:10%}
.tile img{width:100%;height:100%;object-fit:contain;display:block;transition:opacity .3s}
.tile:hover img{opacity:.85}
.tile .cap{padding:12px 0 0}
.no{font:500 13px/1.4 var(--sans);color:var(--sub);letter-spacing:.2em}
.tt{font-family:var(--serif);font-size:19px;line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.untitled{color:var(--faint);font:400 16px var(--sans);font-style:normal}
.tile .yr{font-size:15px;color:var(--sub);margin-top:2px}

/* リスト */
.list{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.row{display:flex;gap:16px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;text-align:left;width:100%;border-radius:0}
.row:hover{background:var(--wash)}
.row .thumb{width:72px;height:72px;background:var(--wash);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.row .thumb img{width:100%;height:100%;object-fit:contain}
.row .body{min-width:0;flex:1}
.row .sub{font-size:16px;color:var(--sub);margin-top:2px}
.miss{display:inline-block;font-size:14px;color:var(--warn);margin:4px 10px 0 0;letter-spacing:.02em}
.miss:before{content:"— "}
.flag{display:inline-block;font-size:13px;letter-spacing:.14em;color:var(--ink);border:1px solid var(--ink);padding:0 6px;margin:4px 10px 0 0}
.more{display:block;margin:48px auto 0;padding:14px 36px;border:1px solid var(--ink);background:none;font-size:16px;letter-spacing:.12em;border-radius:0}
.more:hover{background:var(--ink);color:var(--inv)}

/* 下のナビ */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;white-space:nowrap;padding:0 2px;color:var(--sub);position:relative}
nav button .ic{font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
nav button.on{color:var(--ink)}
nav button.on .ic{color:var(--ink)}
nav button.on:after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ink)}

/* 作品ページ */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.pagehead{position:sticky;top:0;background:var(--glass);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2}
.back{border:0;background:none;padding:6px 0;font-size:17px;letter-spacing:.06em}
.pagebody{max-width:880px;margin:0 auto;padding:24px 20px 80px}
.gallery{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 8px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery a{flex:none;width:100%;scroll-snap-align:center;background:var(--wash);display:flex;align-items:center;justify-content:center;position:relative;padding:6%}
.gallery.many a{width:88%}
.gallery img{width:100%;max-height:64vh;object-fit:contain;display:block}
.gallery .kind{position:absolute;left:12px;bottom:10px;color:var(--sub);font-size:13px;letter-spacing:.18em}
.nophoto{background:var(--wash);padding:56px 20px;text-align:center;color:var(--sub);font-size:17px}
.title{margin:32px 0 6px;font-size:34px;line-height:1.2}
@media(min-width:700px){.title{font-size:42px}}
.subtitle{color:var(--sub);font-size:17px}
.tombstone{margin-top:14px;color:var(--ink);font-size:18px;line-height:1.8}
.tombstone span{color:var(--sub)}
.loc{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:16px 0;margin:28px 0 0}
.loc .lk{font-size:13px;color:var(--sub);letter-spacing:.2em;text-transform:uppercase}
.loc b{font-weight:500;font-size:20px;text-align:right}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 8px}
.act{padding:15px 10px;border:1px solid var(--line);background:var(--paper);font-size:17px;letter-spacing:.04em;border-radius:0}
.act:hover{border-color:var(--ink)}
.act.main{background:var(--ink);border-color:var(--ink);color:var(--inv)}
.sec{margin:56px 0 16px;font-size:15px;font-family:var(--sans);font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--sub);display:flex;align-items:center;gap:14px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
dl.info{display:grid;grid-template-columns:6.5em 1fr;margin:0}
dl.info dt,dl.info dd{padding:13px 0;border-bottom:1px solid var(--line);margin:0}
dl.info dt{color:var(--sub);font-size:16px}
dl.info .empty{color:var(--faint)}
dl.info dd{position:relative;padding-right:44px}
.pen{position:absolute;right:0;top:50%;transform:translateY(-50%);width:36px;height:36px;border:1px solid var(--line);background:var(--paper);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);padding:0}
.pen:hover{border-color:var(--ink);color:var(--ink)}
.loc{position:relative}
.loc .pen{position:static;transform:none;margin-left:10px;flex:none}
.tl li{position:relative}
.tl .pen{top:18px;transform:none}
.flagbox{border-left:2px solid var(--warn);background:var(--warn-soft);color:var(--warn);padding:12px 16px;margin-top:18px;font-size:17px}

.dots{display:flex;justify-content:center;gap:14px;margin-top:14px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--faint);opacity:.5;cursor:pointer}
.dots span.on{background:var(--ink);opacity:1}
.gallery a{cursor:zoom-in}
@media(min-width:900px){
  .pagebody{max-width:1240px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:64px;align-items:start;padding-top:40px}
  .media{position:sticky;top:90px}
  .gallery{margin:0;padding:0}
  .gallery a,.gallery.many a{width:100%}
  .gallery img{max-height:78vh}
  /* 写真が複数あるときは、左の列に縦に並べる */
  .media:has(.gallery.many){position:static}
  .gallery.many{flex-direction:column;overflow:visible;scroll-snap-type:none;gap:20px}
  .gallery.many a{width:100%}
  .media:has(.gallery.many) .dots{display:none}
  .title{margin-top:0}
}
.viewer{position:fixed;inset:0;z-index:95;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 12px 110px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
html,body{touch-action:pan-x pan-y}.docview,.docview *{touch-action:pan-x pan-y}.viewer,.viewer img{touch-action:none}.viewer button{touch-action:manipulation}
.viewer{overflow:hidden;overscroll-behavior:contain}.viewer img{will-change:transform;cursor:zoom-in}.viewer img.zoomed{cursor:grab}#viewer #vimg{flex:1 1 0;min-height:0;width:100%;height:0;max-width:none;max-height:none;object-fit:contain}
.vclose{position:absolute;top:12px;left:16px;z-index:3;border:1px solid var(--line);background:var(--paper);padding:8px 16px;font-size:16px;border-radius:999px}
.vbar{position:absolute;bottom:52px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:24px;font-size:16px;color:var(--sub)}
.vbar button{border:1px solid var(--line);background:var(--paper);padding:8px 18px;font-size:17px;border-radius:999px}
#vorig{position:absolute;bottom:16px;font-size:14px;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px}

/* タイムライン */

/* 年表 */
#chronobar{max-width:1200px;margin:0 auto}
.decs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;border-top:1px solid var(--line)}
.decs::-webkit-scrollbar{display:none}
.decs button{flex:none;border:1px solid var(--line);background:var(--paper);padding:5px 12px;font:500 15px var(--sans);letter-spacing:.06em;border-radius:999px;color:var(--sub)}
.decs button:hover{border-color:var(--ink);color:var(--ink)}
.chead h2{font-size:34px;margin-top:6px}
.csub{color:var(--sub);font-size:16px;margin:6px 0 0}
.cy{display:grid;grid-template-columns:1fr;gap:6px;border-top:1px solid var(--ink);padding:18px 0 22px;margin-top:22px}
@media(min-width:700px){.cy{grid-template-columns:6.5em 1fr;gap:28px}}
.cyy{font:500 34px/1 var(--serif);letter-spacing:.02em}
.cy>*,.ce,.ce>li{min-width:0;max-width:100%}
.cy{position:relative}
.cage{position:absolute;right:0;top:28px;font-size:15px;color:var(--faint);letter-spacing:.08em}

.mpg{margin:0 0 8px}.mpg>small{display:block;color:var(--sub,#888);font-size:13px;margin:0 0 4px}.mpick .pick{display:flex;flex-wrap:wrap;gap:6px}.mpick .pick button{padding:6px 12px;font-size:15px}.mpadd{width:100%;margin-top:4px}

.wdocs{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}.wdoc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}.wdoc b{flex:1;font-size:16px}.wdoc small{color:var(--sub);font-size:13px}.wdoc .tg{opacity:.5}

.evdupbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 12px;margin-top:6px;border:1px solid var(--warn);border-radius:10px;background:transparent;color:var(--ink);font-size:15px}.evdupbtn small{color:var(--warn);white-space:nowrap}
.evsib{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;padding:10px 12px;border-radius:12px;background:var(--wash);font-size:14px;line-height:1.5}.evsib input{width:20px;height:20px;flex:none;margin-top:2px}
.evconf{border:1px solid var(--warn);border-radius:12px;padding:10px 12px;color:var(--warn)}.evconf>b{display:block;margin-bottom:6px;font-size:14px}.evcf{margin-top:8px}.evcf small{display:block;color:var(--sub);font-size:12px;margin-bottom:4px}.evopt{display:block;width:100%;text-align:left;margin:4px 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:15px}.evopt.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset;font-weight:700}

/* AIにきく（チャット） */
.chat{display:flex;flex-direction:column;gap:6px;max-width:720px;margin:0 auto}
.day{align-self:center;font-size:14px;color:var(--faint);letter-spacing:.08em;margin:6px 0 10px}
.bubble-row{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.bubble-row.user{justify-content:flex-end}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--inv);display:flex;align-items:center;justify-content:center;font:500 17px var(--serif);align-self:flex-start}
.bwrap{display:flex;flex-direction:column;max-width:85%}
.bubble-row.ai .bwrap{max-width:94%}
.bubble-row.user .bwrap{align-items:flex-end}
.who{font-size:14px;color:var(--sub);margin:0 0 4px 2px}
.msg{white-space:pre-wrap;word-break:break-word;line-height:1.7;padding:11px 15px;border-radius:20px;font-size:18px}
.msg.user{background:var(--ink);color:var(--inv);border-bottom-right-radius:6px}
.msg.ai{background:var(--wash);color:var(--ink);border-top-left-radius:6px}
.time{font-size:13px;color:var(--faint);margin:3px 6px 0;white-space:nowrap}
.msg .wl{border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:0 8px;margin:0 2px;font-size:16px;font-weight:500;border-radius:999px;letter-spacing:.02em}
.typing{display:inline-flex;gap:5px;padding:16px 18px}

.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px 0}
.suggest button{padding:9px 14px;border:1px solid var(--line);background:var(--paper);font-size:17px;border-radius:999px;text-align:left}
.suggest button:hover{border-color:var(--ink)}
.ask{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:flex-end;gap:10px;z-index:25}
.ask textarea{flex:1;min-width:0;width:100%;resize:none;min-height:46px;max-height:140px;padding:11px 18px;border:1px solid var(--line);background:var(--wash);font-size:19px;border-radius:24px;line-height:1.4}
.ask textarea:focus{outline:none;border-color:var(--ink);background:var(--paper)}
.ask button{flex:none;width:46px;height:46px;border:0;background:var(--ink);color:var(--inv);border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0}
.ask button:disabled{background:#cfcfcf}
.chathead{position:sticky;top:0;z-index:20;margin:-28px -20px 0;background:var(--glass);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px}
.chathead .avatar{width:40px;height:40px;font-size:19px;align-self:center}

.chathead span{font-size:14px;color:var(--sub)}
.chathead .reset{margin-left:auto;flex:none;white-space:nowrap;background:none;border:1px solid var(--line);color:var(--sub);font-size:15px;padding:6px 12px;border-radius:999px}
.chathead>div:first-child{min-width:0}
.chathead span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--inv);padding:12px 22px;z-index:80;font-size:16px;letter-spacing:.06em}
/* 読み込み中・保存中・新しい版のお知らせは、画面の一番上の帯で出す。帯が出ている間は画面全体が一段下がる（隠さない） */
html{--tb:0px}html.tb{--tb:calc(40px + env(safe-area-inset-top))}
body{padding-top:var(--tb);transition:padding-top .25s ease}
header{top:var(--tb)}
.page,.viewer,.quiz,.brief,.docview,.tour{top:var(--tb);transition:top .25s ease}
.sheet{top:calc(var(--vvt,0px) + var(--tb));height:calc(var(--vvh,100%) - var(--tb))} /* キーボードが出ても入力欄が見える位置を保つ */
.toast{top:calc(var(--tb) + env(safe-area-inset-top) + 14px)}
.loading,.updbar,.tmsg{position:fixed;top:0;left:0;right:0;height:var(--tb);box-sizing:border-box;z-index:9999;display:flex;align-items:center;justify-content:center;gap:10px;padding:env(safe-area-inset-top) 16px 0;margin:0;border:0;border-radius:0;color:#fff;font-size:15px;font-weight:600;letter-spacing:.05em;overflow:hidden;animation:tbin .25s ease-out}
.loading{background:rgba(232,135,30,.72);z-index:10000}
.loading,.updbar,.tmsg{-webkit-backdrop-filter:saturate(170%) blur(14px);backdrop-filter:saturate(170%) blur(14px);text-shadow:0 1px 2px rgba(0,0,0,.18)}
.tmsg{background:rgba(61,138,92,.72);z-index:10001}.tmsg::before{content:'✓';font-size:16px;font-weight:700}
.loading::before{content:'';position:fixed;inset:0;z-index:-1;background:transparent}
.loading::after,.updbar.go::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:40%;background:rgba(255,255,255,.85);border-radius:3px;animation:tbrun 1.1s ease-in-out infinite}
.ldsp{width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:ldspin .8s linear infinite;flex:none}
@keyframes ldspin{to{transform:rotate(360deg)}}
@keyframes tbrun{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes tbin{from{transform:translateY(-100%)}to{transform:none}}
.logrow{border-bottom:1px solid var(--line);padding:12px 0;font-size:16px}

/* ===== シンプル・モダン（上書き） ===== */

/* ---------- 確認メモ（付箋） ---------- */
:root{--note:#FFF59D;--note2:#f3edd8;--note-ink:#3a3629;--note-sub:#6B6450;--note-tape:rgba(255,255,255,.5);--note-shadow:0 1px 1px rgba(0,0,0,.06),0 6px 14px -8px rgba(60,50,20,.22);--note-done:#e3e8da;--note-done2:#e3e8da} /* 付箋は落ち着いた生成りの黄色 */
:root[data-theme="dark"]{--note-shadow:0 8px 18px -6px rgba(0,0,0,.6)}
.mmhd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.mmhd .hsec{margin:0}

.mmnote{position:relative;background:var(--note);color:var(--note-ink);padding:30px 16px 14px 16px;box-shadow:var(--note-shadow);transform:rotate(-.8deg);border-radius:2px}
.mmnote:nth-child(2n){transform:rotate(.7deg)}
.mmnote:nth-child(3n){transform:rotate(-.3deg)}
.mmnote::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:20px;margin-left:-42px;background:var(--note-tape);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mmnote.done{background:var(--note-done)}
.mmtxt{font-size:18px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin:0 0 10px;font-weight:500}
.mmnote.done .mmtxt{opacity:.7}
.mmws{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.mmw{display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.55);color:var(--note-ink);border-radius:10px;padding:4px 10px 4px 4px;font-size:15px;max-width:100%;text-align:left}
.mmw .mmth{position:relative;width:48px;height:48px;flex:none;border-radius:6px;overflow:hidden;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:11px}
.mmw .mmth img{width:100%;height:100%;object-fit:cover}
.mmth .wm{display:none}
.mmw{background:#fffbe0!important}

.mmck .bx{width:28px;height:28px;border:2px solid var(--note-ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.5);color:transparent}
.mmck input:checked + .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.mmck.dis{cursor:default;opacity:.55}
.mmmeta{font-size:12.5px;color:var(--note-sub);line-height:1.5}

.wtbl tbody tr{cursor:pointer}

.wtbl .c-ph{position:sticky;left:0;z-index:1;box-sizing:border-box;width:64px;min-width:64px;max-width:64px;padding:6px 8px}

.wtbl th.c-ph,.wtbl th.c-tt,.wtbl th.c-no{z-index:2}.wtbl .c-no{position:sticky;left:0;z-index:1;box-sizing:border-box;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);padding-left:12px;padding-right:6px}.wtbl .c-ph{left:var(--wno,0px)!important}.wtbl .c-tt{left:calc(var(--wno,0px) + var(--wph,64px))!important}
.wtbl .tph{width:48px;height:48px;background:var(--wash);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.wtbl .tph img{width:100%;height:100%;object-fit:contain}.wtbl .tph .wm{font-size:6px}
.wtbl .tno{font-size:13px;color:var(--faint)}.wtbl .ttt{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wtbl .nil{color:var(--faint)}.wtbl .lack{color:var(--warn);font-size:14px}
.wtbl .num{text-align:right;font-variant-numeric:tabular-nums}
.wtbl .wloc{display:inline-block;vertical-align:middle;font-size:13.5px;padding:1px 8px;border-radius:999px;background:var(--wash2);margin-right:6px}
.wtbl .locp{display:inline-block;max-width:200px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.wtbl .lcw{display:flex;align-items:center;gap:0}
.wtbl .ok{color:var(--ok);font-weight:600}
.wtbl td.c-fl{white-space:normal}
.wtbl .memo{display:block;margin-top:4px;font-size:14px;line-height:1.5;white-space:normal;word-break:break-word}
.wtbl .flag{margin:0 6px 0 0;color:#fff;background:var(--warn);border-color:var(--warn);font-weight:600}
.wtbl td.c-fl .memo{color:var(--warn)}

/* ---------- AIチャット（吹き出し） ---------- */
nav.fmask{background:linear-gradient(135deg,#6d5bf5,#2aa7c4);border:0!important;box-shadow:0 10px 26px -8px rgba(80,70,220,.55)}

.aip{position:fixed;z-index:60;right:16px;bottom:calc(var(--nav) + 30px + env(safe-area-inset-bottom));width:min(440px,calc(100vw - 32px));height:min(660px,calc(100vh - var(--nav) - 70px));height:min(660px,calc(100dvh - var(--nav) - 70px));
  background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 60px -12px rgba(0,0,0,.38);display:flex;flex-direction:column;transform-origin:bottom right;animation:aipIn .2s ease}
.aip.hidden{display:none}
.aip::after{content:"";position:absolute;right:46px;bottom:-9px;width:16px;height:16px;background:var(--paper);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
@keyframes aipIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}

.aipt{min-width:0;flex:1}.aipt b{display:block;font-size:16px;line-height:1.3}.aipt span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aireset{flex:none;border:1px solid var(--line);background:none;color:var(--sub);font-size:13px;padding:5px 10px;border-radius:999px}

#aip .ask{position:static;border-top:1px solid var(--line);background:transparent;backdrop-filter:none;border-radius:0 0 22px 22px;padding:10px 12px}

#aip .ask button:disabled{background:#cfcfcf}

  .aip{left:8px;right:8px;width:auto;top:calc(8px + env(safe-area-inset-top));height:auto;bottom:calc(var(--nav) + 26px + env(safe-area-inset-bottom))}
  .aip::after{right:34px}
}

/* ---------- iPhoneのホーム画面アプリ：上の白い帯とぼかしの下に、大事なものを置かない ---------- */
:root{--cap:0px}
html.sa{--cap:env(safe-area-inset-top,0px)} /* 上の余白は画面の切り欠きの分だけ（すき間は作らない） */
html.sa body{padding-top:0}
html.sa header{top:0;padding-top:calc(var(--cap) + 14px)}
html.sa main,html.sa .home{scroll-margin-top:var(--cap)}
html.sa .page,html.sa .viewer,html.sa .quiz{top:0}
html.sa .pagehead{padding-top:calc(var(--cap) + 12px)}
html.sa .viewer{padding-top:calc(60px + var(--cap))}
html.sa .vclose{top:calc(12px + var(--cap))}
html.sa .quiz{border-top:var(--cap) solid var(--bg)}
html.sa .toast{top:calc(14px + var(--cap))}
@media(max-width:700px){ html.sa .aip{top:calc(8px + var(--cap))} }
/* ホーム画面アプリで上の帯（読み込み中など）が出ているとき：帯が上の白い部分も覆い、その分だけ全体を下げる */
/* ホーム画面アプリ：帯は上の余白（--cap）の位置にそのまま重ねる。帯が出ている間はその余白を詰めるので、白いすき間も画面のずれも出ない */
html.sa.tb{--tb:40px}
html.sa .loading,html.sa .updbar,html.sa .tmsg{top:0;padding-top:0}
html.sa body{padding-top:var(--tb)}
html.sa.tb header{top:var(--tb);padding-top:calc(var(--cap) + 14px - var(--tb))}
html.sa .page,html.sa .viewer,html.sa .quiz{top:var(--tb)}
html.sa.tb .pagehead{padding-top:calc(var(--cap) + 12px - var(--tb))}
html.sa.tb .viewer{padding-top:calc(60px + var(--cap) - var(--tb))}
html.sa.tb .vclose{top:calc(12px + var(--cap) - var(--tb))}
html.sa.tb .quiz{border-top-width:calc(var(--cap) - var(--tb))}
/* ===================== Claude風のデザイン（上：メニュー・ページ名・名前／下：検索と質問） ===================== */
:root{--bg:#faf9f5;--paper:#ffffff;--ink:#141413;--sub:#5e5d59;--faint:#8f8d86;--line:#e8e6dc;--wash:#f0eee6;--wash2:#e8e6dc;--inv:#ffffff;
  --glass:rgba(250,249,245,.88);--glass-p:rgba(255,255,255,.8);--acc:#c96442;--acc2:#d97757;
  --disp:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;--nav:88px}
html[data-theme=dark]{--bg:#262624;--paper:#30302e;--ink:#faf9f5;--sub:#c2c0b6;--faint:#8f8d86;--line:#3d3d3a;--wash:#30302e;--wash2:#3d3d3a;--inv:#262624;
  --glass:rgba(38,38,36,.88);--glass-p:rgba(48,48,46,.82)}
body{background:var(--bg)}
header{background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(16px);backdrop-filter:saturate(160%) blur(16px);border-bottom:1px solid var(--line);padding:8px 10px 0}
.appbar{display:flex;align-items:center;gap:4px;min-height:48px;max-width:1200px;margin:0 auto;padding-bottom:6px}
.appbar h1,.brand.appbar h1{flex:1;min-width:0;text-align:center;font:600 17px/1.2 var(--sans);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
#top .appbar #btnBack{display:none!important}body.vhb:not(.pgopen):not(.scr) #top .appbar #btnBack{display:flex!important}
.abtn{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.abtn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.abtn:active{background:var(--hov)}
.appbar .brandr{flex:none;width:44px;display:flex;justify-content:center}
.avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font:600 15px/1 var(--sans);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.avatar.sm{width:32px;height:32px;font-size:14px}
#finder .search,#chronobar .search{display:none}
#finder .chips,#chronobar .chips{padding-top:4px}
#finder:empty,#chronobar:empty{display:none}
/* 下の検索と質問 */
.cbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto}
.cbin{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:52px;padding:0 8px 0 16px;border-radius:26px;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 24px -8px rgba(0,0,0,.18)}
.cbin>svg{width:20px;height:20px;fill:none;stroke:var(--faint);stroke-width:1.9;stroke-linecap:round;flex:none}
.cbin input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;color:var(--ink);padding:0;height:100%;-webkit-appearance:none;appearance:none}
.cbin input::-webkit-search-cancel-button{display:none}
.cbin input::placeholder{color:var(--sub);opacity:1}
.cbin>svg{stroke:var(--sub)!important}
.cbin{height:56px!important;border-radius:28px!important}
/* 質問ボタン：AIらしい青のグラデーションで、アイコンだけの丸 */
.cbask{width:56px;height:56px;padding:0!important;border-radius:50%;justify-content:center;background:linear-gradient(135deg,#6d5bf5,#2a8fd4)!important;box-shadow:0 8px 22px -8px rgba(80,90,230,.7)!important}
.cbask>span:not(.ic){display:none}
.cbask .ic svg{width:26px;height:26px}
.appbar .abtn svg{stroke-width:2.1}
#fsqClose{width:32px;height:32px;border-radius:50%;border:0;background:var(--wash2);color:var(--sub);font-size:13px;flex:none;padding:0}
.cbask{flex:none;height:52px;padding:0 18px 0 14px;border-radius:26px;border:0;background:var(--acc);color:#fff;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;box-shadow:0 8px 20px -8px rgba(201,100,66,.7)}
.cbask{background:linear-gradient(135deg,#6d5bf5,#2aa7c4)!important;box-shadow:0 8px 22px -8px rgba(80,70,220,.6)!important} /* 質問（AI）はAIらしい青 */
.cbask.on{background:linear-gradient(135deg,#5646d8,#1f8aa3)!important}
.cbask .ic{display:flex}.cbask .ic svg{width:22px;height:22px;fill:#fff}
.cbask.on{background:var(--ink);color:var(--bg)}
body.briefing .cbar,body.loggedout .cbar{display:none}
/* キーボードが出ている間は、下の検索欄をキーボードのすぐ上に置く */
@media (pointer:coarse){
  body:not(.searching) #fsq{pointer-events:none}
  body.searching .cbar{top:calc(var(--vvt,0px) + var(--tb) + var(--cap) + 6px);bottom:auto;left:12px;right:12px;transition:none}
  body.searching:not(.pgopen) .appbar{opacity:0;pointer-events:none}
}
body.slock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
/* 検索の入力中は「質問」ボタンを消して、検索欄を横いっぱいに */
body.searching .cbask{display:none}
body.kbopen .appbar{top:calc(var(--vvt,0px) + var(--tb) + var(--cap) + 6px);transition:none}
.page::after{content:'';display:block;height:calc(84px + env(safe-area-inset-bottom))}
/* メニュー（左から） */
:root{--dww:min(300px,80vw)}
.drawer{position:fixed;inset:0;top:var(--tb);z-index:120}
.dwscrim{position:absolute;inset:0;left:var(--dww);border:0;padding:0;background:rgba(20,20,19,.10);opacity:0;transition:opacity .22s ease}
/* スマホ：メニューは上に重ねず、画面を右へ押し出す（右に少し中身が見える） */
header,main,.cbar,.page{transition:translate .22s ease}
body.dwopen header,body.dwopen main,body.dwopen .cbar,body.dwopen .page{translate:var(--dww) 0}
body.dwopen{overflow:hidden}
.dwpanel{position:absolute;top:0;bottom:0;left:0;width:var(--dww);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 10px calc(env(safe-area-inset-bottom) + 12px)}
html.sa .dwpanel{padding-top:calc(var(--cap) + 8px)}
.drawer.open .dwscrim{opacity:1}.drawer.open .dwpanel{transform:none}
.dwhead{font:600 21px/1.4 var(--disp);padding:6px 12px 18px;color:var(--ink);letter-spacing:.02em}
.dwnav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.dwnav button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 12px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:16px;text-align:left}
.dwnav .pic{display:flex;color:var(--sub)}
.dwnav .pic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.dwnav button.on{background:var(--wash2);font-weight:600}.dwnav button.on .pic{color:var(--ink)}
.dwnav button:active{background:var(--hov)}
.dwfoot{border-top:1px solid var(--line);padding-top:8px;display:flex;align-items:center;gap:4px}
.dwfoot .dwme{flex:1;min-width:0}
.dwtheme{flex:none;width:32px;height:32px;margin-right:10px;padding:0;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--faint);border-radius:50%;background:none;color:var(--sub);cursor:pointer;box-sizing:border-box}
.dwtheme:hover{background:var(--hov);color:var(--ink)}
.dwtheme svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dwme{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:12px;text-align:left;color:var(--ink);font-size:15px}
.dwme small{display:block;color:var(--sub);font-size:12px;font-weight:400}
/* 文字の雰囲気：見出しは明朝、やわらかい角丸 */
.hello,.pagebody .title,h2.title,.chead h2,.sheet h3,.hsec{font-family:var(--disp);font-weight:600;letter-spacing:.02em}
.hello{font-size:27px;line-height:1.35}
.chip{border-radius:999px}
.sheet .box{border-radius:20px 20px 0 0}
.tile .ph{border-radius:12px;overflow:hidden}
html.sa header{padding-top:calc(var(--cap) + 4px)}
/* ===== 上の部分：Claudeのように、ボタンを1つずつガラス風に浮かせて常に表示（中身はその下をスクロール） ===== */
header,header.tuck{position:relative;z-index:auto!important;top:auto!important;transform:none!important;background:transparent!important;border:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;padding:calc(var(--tb) + var(--cap) + var(--edge,0px) + 68px) 10px 0!important;transition:none}
html.tb header{padding-top:calc(var(--cap) + var(--edge,0px) + 68px)!important}
/* iPhoneのホーム画面アプリ（iOS 26以降）は、画面の上端から約38ptに自動でぼかしをかける（アプリ側では止められない）。
   上のボタンをその帯より下に置いて、ボタンがにじんで見えないようにする */

.appbar,.brand.appbar{position:fixed;top:calc(var(--tb) + var(--cap) + var(--edge,0px) + 6px);left:10px;right:10px;z-index:35;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:0;max-width:none;margin:0;padding:0;pointer-events:none;transition:top .25s ease,left .22s ease,translate .22s ease}
.appbar>*{pointer-events:auto}
/* 詳細ページ・入力画面でも上のボタンは出したまま（写真の拡大・書類・クイズなど全画面のときだけ隠す） */
.appbar,.brand.appbar{z-index:96}
body.pgopen .page .pagehead{display:none}
.page{padding-top:calc(var(--tb) + var(--cap) + var(--edge,0px) + 68px)}
body.hidebar .appbar,body.kbopen:has(#sheet:not(.hidden)) .appbar{opacity:0;pointer-events:none}
.appbar{transition:top .25s ease,left .22s ease,translate .22s ease,opacity .15s}
.sheet .box{max-height:min(92vh, calc(var(--vvh,100vh) - 12px - var(--tb) - 70px))}

/* Claudeのアプリと同じ：半透明のガラス（後ろがぼける）＋うっすら光る縁 */

.glass,.appbar .abtn,.appbar h1,.appbar .avatar,.cbin,.cbask{-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.glass,.appbar .abtn,.appbar h1,.appbar .avatar,.cbin{background:var(--gl)!important;border:1px solid var(--gl-b)!important;box-shadow:var(--gl-s)!important;color:var(--ink)}

.appbar .abtn,.appbar h1:not(.st-busy):not(.st-ok):not(.st-upd){background:rgba(255,255,255,.52)!important;-webkit-backdrop-filter:saturate(200%) blur(40px)!important;backdrop-filter:saturate(200%) blur(40px)!important}

/* 検索欄：何も入っていないときは、より透けさせる（入力中・入力済みはくっきり） */

.cbin{transition:background .2s}
/* 並び替え・列の数のボタン：細い線をやめて、年代などのサブのボタンと同じ淡い塗りに */
#sort,#osort{border:1px solid transparent!important;background-color:var(--wash)!important;color:var(--ink)!important;font-weight:500}
.zoomb{border:1px solid transparent!important;background:var(--wash)!important}
.zoomb button{background:transparent!important;color:var(--ink)!important;font-weight:500}
.zoomb button+button{border-left:1px solid var(--line)!important}
/* 画面のいちばん上（時計の下〜上のボタンのあたり）は、どのページでも地の色でうっすらぼかす（上端が暗いグラデーションにならないように） */
/* 画面上部のアプリ側のぼかしはなし（iPhoneが自動でかけるぼかしだけ。Claudeのアプリと同じ見え方） */
body::before{display:none!important}
body.loggedout::before{display:none}

/* 年表・展覧会の「年」：ガラスのボタン＋画面いっぱいの線を、上のボタンのすぐ下にいっしょに固定。止まっている間は線より上をぼかす */

.cyh::after{content:'';position:absolute;left:-100vw;right:-100vw;top:50%;height:2.5px;margin-top:-1.25px;background:color-mix(in srgb,var(--ink) 30%,transparent);z-index:0;pointer-events:none}
.cyh::before{content:'';display:none;position:absolute;left:-100vw;right:-100vw;bottom:50%;height:calc(var(--stk,0px) + 40px);background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:0;pointer-events:none}

.hidx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 28px}.hidx a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--wash);color:var(--ink);text-decoration:none;font-size:15px;font-weight:500}
.hidx a b,.hno{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;flex:none}

.hl{font-size:17px;line-height:1.7;margin:0 0 14px}.hshot{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--wash);max-width:360px;margin:0 auto 16px;box-shadow:0 10px 30px -14px rgba(0,0,0,.35)}.hshot img{display:block;width:100%;height:auto}
.hsteps{margin:0;padding-left:1.4em;font-size:17px;line-height:1.75}.hsteps li{margin:0 0 6px}.hsteps b,.hl b{background:linear-gradient(transparent 60%,color-mix(in srgb,#e8b04a 45%,transparent) 60%)}
.hend{margin:24px 0 10px;text-align:center;color:var(--sub);font-size:16px}
.dwhelp{margin-top:8px;border-top:1px solid var(--line)!important;border-radius:0 0 12px 12px!important}

#yfix.side{z-index:97}#yfix.side .cyh::after{display:none}#yfix.side .cyh{height:var(--abh,52px)}#yfix.side .cyp{margin-left:0;box-sizing:border-box;height:var(--abh,52px);border-radius:calc(var(--abh,52px)/2);box-shadow:none;border:1.5px solid rgba(255,255,255,.75)}

.cyp{position:relative;z-index:1;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px;margin-left:-6px;border-radius:23px;white-space:nowrap;-webkit-backdrop-filter:saturate(200%) blur(40px);backdrop-filter:saturate(200%) blur(40px);box-shadow:var(--gl-s);color:#faf9f5;background:rgba(30,30,28,.58);border:1px solid rgba(255,255,255,.12)}
.cyp .cyy{font-size:20px!important;line-height:1!important;font-weight:600;color:inherit}
.cyp .cage{position:static!important;font-size:13px!important;letter-spacing:.04em;color:rgba(250,249,245,.65)!important}

html[data-theme=dark] .cyp .cage{color:rgba(20,20,19,.55)!important}
/* 上のボタンは、画面と逆の配色（明るい表示では暗いガラス、暗い表示では明るいガラス） */
.appbar .abtn,.appbar h1:not(.st-busy):not(.st-ok):not(.st-upd),.appbar .avatar{--ink:#faf9f5;--sub:rgba(250,249,245,.7);--faint:rgba(250,249,245,.5);--hov:rgba(255,255,255,.12);color:#faf9f5!important;background:rgba(30,30,28,.58)!important;border-color:rgba(255,255,255,.12)!important}
html[data-theme=dark] .appbar .abtn,html[data-theme=dark] .appbar h1:not(.st-busy):not(.st-ok):not(.st-upd),html[data-theme=dark] .appbar .avatar{--ink:#141413;--sub:rgba(20,20,19,.62);--faint:rgba(20,20,19,.45);--hov:rgba(0,0,0,.08);color:#141413!important;background:rgba(250,249,245,.62)!important;border-color:rgba(255,255,255,.8)!important}
.appbar .avatar .avi{background:var(--ink)!important;color:var(--bg)!important}
html:not([data-theme=dark]) .appbar .avatar .avi{background:#faf9f5!important;color:#141413!important}

.appbar .abtn{width:52px;height:52px;border-radius:50%}
/* メニューのボタンはアプリのアイコン（丸く切り抜き） */
.appbar .abtn .abapp{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.appbar .abtn:has(.abapp){padding:0;overflow:hidden;background:transparent!important} /* 枠はページ名のボタンと同じ白い縁 */
.appbar .abtn,.appbar h1,.appbar .avatar{box-shadow:none!important} /* 上のボタンは影なし */
.appbar .abtn,.appbar h1:not(.st-busy):not(.st-ok):not(.st-upd){border:1.5px solid rgba(255,255,255,.75)!important}

.appbar h1,.brand.appbar h1{cursor:pointer!important;-webkit-user-select:none;user-select:none;flex:0 1 auto;max-width:calc(100% - 140px);height:52px;display:flex;align-items:center;padding:0 22px;border-radius:26px;font:600 16px/1 var(--sans)}

}

    if (f==='unconf' && !needLoc(w)) return false;
    if (f==='nophoto' && photoBy[w['作品番号']]) return false;
    if (f==='noname' && hasName(w)) return false;
    if (f==='noloc' && hasLoc(w)) return false;
    if (f==='tmp' && !(photoBy[w['作品番号']]||[]).some(p => /^【仮】/.test(p['メモ']||''))) return false;
    if (f==='lack' && !lacks(w).length) return false;
    if (['自宅','美術館','個人蔵','委託中','廃棄'].includes(f) && w['所在区分']!==f) return false;

/* ② AIで読み取る（2通ずつ） */
async function readDocsFlow(ids){
  if (!S.ai) return alert('AIの設定がまだです');
  let n = 0, limited = false, errs = 0;
  try {
    for (let i = 0; i < ids.length; i++) {
      busy(true, 'AIが書類を読んでいます（' + (i + 1) + '/' + ids.length + '）　1通 20秒ほど');
      let r;
      try { r = await call('readDocs', [ids[i]]); }
      catch(e){
        // iPhoneは長い通信を途中で切ることがある。Google側では読み続けているので、結果が出るのを待って確かめる
        if (!/load failed|failed to fetch|network|通信/i.test(String(e && e.message || e))) throw e;
        let ok = false;
        for (let k = 0; k < 8 && !ok; k++) {
          busy(true, 'AIが書類を読んでいます（' + (i + 1) + '/' + ids.length + '）　もう少し待ってね…');
          await new Promise(res => setTimeout(res, 10000));
          try { setData(await call('getData')); const d = docById(ids[i]); ok = !!d && d['状態'] !== 'まだ'; } catch(x){}
        }
        ok ? n++ : errs++; continue;
      }
      setData(r.data); Object.values(r.res).forEach(x => x.err ? errs++ : n++);
      if (r.limited) { limited = true; break; }
    }
  } catch(e){ alert('読み取れませんでした。\n' + (e.message||e)); }
  finally { busy(false); }
  closeAllPages(); S.view = 'doc'; render(); window.scrollTo(0, 0);
  if (limited) alert('AIの利用回数の上限に達しました。少し時間をおいてから、続きを読んでください。');
  else if (errs) alert(errs + '通は読み取れませんでした。写真を撮り直すと読めることがあります。');
  if (n) { toast(n + '通読みました。内容を確かめてください'); if (ids.length === 1 && docById(ids[0]) && docById(ids[0])['状態']==='確認待ち') sheetDocReview(ids[0]); }
}

function ivTurn(answer){
  if (!IV || IV.busy) return;
  const no = IV.list[IV.wi];
  IV.mode = 'talk';
  if (answer) { IV.last = answer; const h = IV.hist[IV.hist.length - 1]; if (h) h.a = answer; }
  IV.busy = true; IV.listening = false; ivDraw();
  call('interviewTurn', no, IV.hist, answer, !!(QV.tts && S.ai && ttsBad < 3)).then(r => {
    if (!IV) return;
    IV.busy = false;
    (r.ex || []).forEach(x => { IV.pend = IV.pend.filter(p => p.f !== x.f); IV.pend.push(Object.assign({ on: true }, x)); });
    if (r.ep) IV.eps.push({ t: r.ep, on: true });
    if (answer) IV.qa.push({ q: (IV.hist[IV.hist.length - 1] || {}).q || '', a: answer, r: JSON.stringify({ ex: r.ex, ep: r.ep }) });
    IV.q = r.q; IV.hist.push({ q: r.q, a: '' });
    if (r.end || IV.hist.length > 8) { IV.mode = 'sum'; ivDraw(); ivSpeak(r.q, r.audio); return; }
    ivDraw(); ivSpeak(r.q, r.audio, () => { if (IV && IV.mode==='talk' && !IV.text && !IV.busy) ivAutoListen(); });
  }).catch(e => { if (!IV) return; IV.busy = false; IV.q = 'うまくいかなかった。もう一回話してみて。（' + (e.message || e) + '）'; ivDraw(); });
}

  const my = IV; setTimeout(() => { if (IV && IV === my && !IV.listening && !IV.busy && !IV.text && !document.hidden) ivListen(true); }, 450); }
function ivListen(auto){
  if (!IV || IV.busy) return;
  let got = false;
  const ok = listen(t => { got = true; t = String(t||'').trim(); if (!IV) return; IV.listening = false;
    if (IV.mode==='confirm') {
      if (/一覧|リスト|選ぶ/.test(t)) { IV.mode = 'list'; return ivDraw(); }
      if (/別|ちが|違|次|つぎ|いや|だめ/.test(t)) return ivOther();
      if (YES.test(t) || /いい|OK|オッケー|うん|ええ|どうぞ/i.test(t)) return ivTurn('');
      ivDraw(); return toast('「いいよ」「別の絵」「一覧」で答えてね');
    }
    if (/^(終わり|おわり|次の絵|つぎの絵|次の作品)/.test(t)) { IV.mode = 'sum'; sayStop(); return ivDraw(); }
    if (t) ivTurn(t); else ivDraw(); },
    () => { if (IV && !got) { IV.listening = false; ivDraw(); } }, auto);
  if (!ok) { IV.text = true; IV.listening = false; return ivDraw(); }
  IV.listening = true; ivDraw();
}

function ivSave(){
  const no = IV.list[IV.wi], patch = {};

function dashHTML(){
  const W = S.works.filter(w => !['廃棄','統合済み'].includes(w['所在区分'])), n = W.length || 1;
  const cnt = f => W.filter(f).length;
  const has = (w, k, qk) => !!String(w[k]||'').trim() && !/[?？]/.test(w[k]) || qzUnknown(w['作品番号'], qk || k);
  const X = S.exhibits, P = S.pubs, D = S.docs || [];

    ['photo', '写真がある', cnt(w => (photoBy[w['作品番号']]||[]).length), n],
    ['loc', '場所を確認した', cnt(w => w['場所確認日']), n],
    ['flag', '要確認が片付いた', cnt(w => !w['要確認']), n],
    ['quiz', 'クイズで全部確認した', cnt(w => !qzSteps(w['作品番号']).length), n],
    null,
    ['works', '作品名', cnt(w => has(w, '作品名')), n],
    ['works', '描いた年', cnt(w => has(w, '制作年')), n],
    ['works', '大きさ', cnt(w => (w['幅cm'] || w['高さcm']) || qzUnknown(w['作品番号'], 'サイズ')), n],
    ['works', '画材', cnt(w => has(w, '画材')), n],
    null,
    ['exinfo', '展覧会の会場・日付', X.filter(x => String(x['会場']||'').trim() && String(x['開始日']||'').trim()).length, X.length],
    ['link', '展覧会・画集のひも付け', X.filter(x => (worksByEx[x['展覧会ID']]||[]).length).length + P.filter(p => (worksByPb[p['資料ID']]||[]).length).length, X.length + P.length],
    ['doc', '書類の登録', D.filter(d => ['登録済み','登録しない'].includes(d['状態'])).length, D.length],
    ...((S.others||[]).length ? [['otloc', 'その他の作品の保管場所', (S.others||[]).filter(hasLoc).length, S.others.length]] : [])
  ];
  const main = rows.slice(0, 4), tot = main.reduce((a, r) => a + r[2] / r[3], 0) / main.length;

  const bar = r => { if (!r) return '<div class="dsep"></div>'; const [k, t, a, b] = r, p = pct(a, b);
    return `<button class="drow ${p===100?'full':''}" ${k==='quiz' ? 'data-qcstart="1"' : k==='works' ? 'data-dlack="1"' : `data-todo="${k}"`} title="${esc(t)}：${a} / ${b}（${p}%）">
      <span class="dl">${esc(t)}</span><span class="dn">${p===100 ? '✓ ' : ''}${a.toLocaleString()}<small> / ${b.toLocaleString()}</small></span>

  /* 最近7日間に更新した箇所（変更記録から数える。読み込みは10分に1回まで） */
  if (!S.upd || Date.now() - S.upd.t > 600000) setTimeout(loadUpd, 0);

function openWorkAlone(no){ for (let n = 0; n < 12 && SCR.length; n++) { const top = SCR[SCR.length - 1];
    if (top.id === 'sheet') closeSheet(true); else if (top.id === 'viewer') closeViewer(true); else if (top.classList.contains('docview') || top.classList.contains('noteview')) docClose(top, true); else SCR.pop(); }
  S.sheetDoc = null; S.pcur = null; S.stack = []; openWork(no); scrHead(); }
/* 見比べ画面 → 作品ページ：右から重ねて開く（戻ると見比べ画面に戻る） */
function openWorkFromCmp(no, did){ const pg = $('#page'), wasOpen = !pg.classList.contains('hidden'), prev = wasOpen && S.pcur ? { t: S.pcur.t, id: S.pcur.id, sc: pg.scrollTop } : null, st = (S.stack || []).slice();
  const sheetDoc = !$('#sheet').classList.contains('hidden') && S.sheetDoc === did;
  for (let n = 0; n < 12 && SCR.length; n++) { const top = SCR.pop(); if (top.id === 'sheet') { top.classList.add('hidden'); $('#sheetbox').innerHTML = ''; $('#sheetbox').classList.remove('split'); } else if (top.id === 'viewer') top.classList.add('hidden'); else top.remove(); }
  S.sheetDoc = null; SNAP.v = null; S.pcur = null; OWC = true; try { openWork(no); } finally { OWC = false; }
  S.stack = (wasOpen ? st.concat(prev ? [prev] : []) : []).concat([{ t: 'cmp', id: did, did, no, doc: sheetDoc }]);
  scrHead(); scrAnim(pg, '100', '0'); abSync(); }
/* 書類の画面の中で押したか（押した直後に書類の中身が描き直されても判定できるように） */
const inDocSheet = t => !!(S.sheetDoc && !$('#sheet').classList.contains('hidden') && (t.closest('#sheetbox') || !t.isConnected));
function openWorkFromDoc(no, did){ return openPageFromDoc('w', no, did); }
/* 書類 → 作品・展覧会・資料のページ：右から重ねて開き、「戻る」で書類（同じ位置）に戻る */
function openPageFromDoc(t, id, did){
  const pg = $('#page'), wasOpen = !pg.classList.contains('hidden'), prev = wasOpen && S.pcur ? { t: S.pcur.t, id: S.pcur.id, sc: pg.scrollTop } : null, st = (S.stack || []).slice(), dsc = $('#sheet').scrollTop, dsb = $('#sheetbox').scrollTop;
  SNAP.v = null; S.sheetRet = null; closeSheet(true); /* 書類の履歴はそのまま残し、ページを開くときに積む */
  S.pcur = null; ({w:openWork, ex:openEx, pb:openPb, ot:openOt})[t](id);
  S.stack = (wasOpen ? st.concat(prev ? [prev] : []) : []).concat([{ t: 'doc', id: did, dsc, dsb }]);
  scrAnim(pg, '100', '0'); abSync();
}
function closeWork(fromHist){
  { const pg0 = $('#page'), st0 = S.stack || [];
    if (!pg0.classList.contains('hidden') && st0.length && st0[st0.length - 1].t === 'cmp') { /* 見比べ画面に戻る（左から） */
      const p = S.stack.pop(), prev = S.stack.length ? S.stack.pop() : null;
      if (prev) { S.pcur = null; ({w:openWork, ex:openEx, pb:openPb, ot:openOt})[prev.t](prev.id, false, prev.sc); }
      else { pg0.classList.add('hidden'); document.body.style.overflow = ''; S.cur = null; S.pcur = null; S.stack = []; abSync(); }
      if (!fromHist) hback(); if (p.doc) sheetDocReview(p.did); cmpView(p.did, p.no, undefined, true); return; }
    if (!pg0.classList.contains('hidden') && st0.length && st0[st0.length - 1].t === 'doc') { /* 書類の画面に戻る */
      const p = S.stack.pop(), prev = S.stack.length ? S.stack.pop() : null;
      if (prev) { S.pcur = null; ({w:openWork, ex:openEx, pb:openPb, ot:openOt})[prev.t](prev.id, false, prev.sc); }
      else { pg0.classList.add('hidden'); document.body.style.overflow = ''; S.cur = null; S.pcur = null; S.stack = []; abSync(); }
      if (!fromHist) hback(); HIST.noPush++; try { sheetDocReview(p.id); } finally { HIST.noPush--; } setTimeout(() => { if (p.dsc != null) { $('#sheet').scrollTop = p.dsc; $('#sheetbox').scrollTop = p.dsb || 0; } }, 120); return; } }
  const pg = $('#page'), open = !pg.classList.contains('hidden');
  if (open && S.stack.length){ const p = S.stack.pop(); S.pcur = null; ({w:openWork, ex:openEx, pb:openPb, ot:openOt})[p.t](p.id, false, p.sc); if (!fromHist) hback(); return; }
  pg.classList.add('hidden'); document.body.style.overflow=''; S.cur=null; S.pcur=null; S.stack=[]; if (open && !fromHist) hback(); abSync();
}

/* ---------- 写真（カメラで撮る／写真を選ぶ） ---------- */
const photoInputs = multi => `<div class="camrow"><label class="act main camb">カメラで撮る<input type="file" id="pfCam" class="vh" accept="image/&#42;" capture="environment"></label><label class="act camb">写真を選ぶ${multi?'（何枚でも）':''}<input type="file" id="pfLib" class="vh" accept="image/&#42;"${multi?' multiple':''}></label></div><div class="dropz" data-dropz><div class="dzt"><span class="dzpc">画像のURLを貼るか、ここにドラッグしてください</span><span class="dzsp">画像のURLを貼ってください</span></div><div class="dzrow"><input type="url" class="dzurl" placeholder="https://…（画像のURL）" enterkeyhint="go"><button type="button" class="dzgo">追加</button></div></div><img id="pv" class="preview hidden" alt=""><div id="pvs" class="pvs hidden"></div>`;
function bindPhoto(onReady){
  let list = [];
  ['pfCam','pfLib'].forEach(fid => $('#' + fid).onchange = async e => {
    const fs = [...e.target.files]; if (!fs.length) return;
    const add = fid==='pfLib' && e.target.multiple && list.length && fs.length;
    if (!add) list = [];
    busy(true, '写真を準備しています…');
    try {
      for (let i = 0; i < fs.length; i++) { if (fs.length > 1) busy(true, '写真を準備しています（' + (i+1) + '/' + fs.length + '）'); const d = await shrink(fs[i]); list.push({b64:d, mime:PMIME}); }
      const one = list.length===1;
      $('#pv').classList.toggle('hidden', !one); $('#pvs').classList.toggle('hidden', one);
      if (one) $('#pv').src = 'data:' + list[0].mime + ';base64,' + list[0].b64;
      else $('#pvs').innerHTML = list.map(x => `<img src="data:${x.mime};base64,${x.b64}" alt="">`).join('') + `<span class="pvn">${list.length}枚</span>`;
      PMIME = list[list.length-1].mime;
      onReady(list[list.length-1].b64, fid==='pfCam', list.slice());
    }
    catch(err){ alert('この写真は読み込めませんでした'); }
    finally { busy(false); e.target.value = ''; }
  });
}
function setPick(id, v){ const g = $('#' + id); if (!g) return; g.dataset.v = v; g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.o===v)); }
function sheetCover(id){
  const x = pbById[id]; if (!x) return;
  const old = x['表紙写真ファイルID'] ? S.photos.find(p => p['ファイルID']===x['表紙写真ファイルID']) : null;

  let data = null; bindPhoto(d => data = d);
  $('#ok').onclick = () => {
    if (!data) return alert('写真を撮るか選んでください');

/* ---------- 年表 ---------- */
const CF = [['all','すべて'],['ex','展覧会'],['pb','画集・出版'],['make','制作'],['move','寄贈・収蔵']];
const MOVE_T = ['寄贈','寄託','収蔵（種別不明）','販売','譲渡'];
const yr = s => { const m = String(s||'').match(/(\d{4})/); return m ? m[1] : ''; };
function jd(s){ const m = String(s||'').match(/(\d{4})(?:[\/\-.年](\d{1,2}))?(?:[\/\-.月](\d{1,2}))?/); return m ? {y:m[1], m:m[2]?+m[2]:0, d:m[3]?+m[3]:0} : null; }
function fmtDate(a, b){
  const x = jd(a), y = jd(b); if (!x) return '';
  let t = x.y + '年' + (x.m ? x.m + '月' : '') + (x.d ? x.d + '日' : '');
  if (y && (y.y!==x.y || y.m!==x.m || y.d!==x.d)) t += ' – ' + (y.y!==x.y ? y.y + '年' : '') + (y.m ? y.m + '月' : '') + (y.d ? y.d + '日' : '');
  return t;
}
function period(a, b){ const x = jd(a), y = jd(b); if (!x || !x.m) return ''; const f = o => o.m + (o.d ? '.' + o.d : ''); return f(x) + (y && y.m && f(y)!==f(x) ? ' – ' + f(y) : ''); }
function chronoItems(){
  const f = S.cf, only = S.cmain, Y = {};
  const put = (y, it) => (Y[y || '年不明'] = Y[y || '年不明'] || []).push(it);
  if (f==='all' || f==='ex') S.exhibits.forEach(x => { if (!only || x['主要']) put(yr(x['開始日']), {k:'ex', o:x, s:dateKey(x['開始日']) + exNo(x) / 100000}); });
  if (f==='all' || f==='pb') S.pubs.forEach(x => { if (!only || x['主要']) put(yr(x['発行年月']), {k:'pb', o:x, s:dateKey(x['発行年月'])}); });
  if ((f==='all' || f==='make') && !only) { const by = {}; S.works.forEach(w => { const y = yr(w['制作年']); if (y) (by[y] = by[y] || []).push(w); }); Object.keys(by).forEach(y => put(y, {k:'make', list:by[y], s:999999999})); }
  if (f==='all' || f==='move') { const g = {}; S.events.forEach(e => { if (!MOVE_T.includes(e['種類'])) return; const y = yr(e['日付']); if (!y) return; const key = y + '|' + e['種類'] + '|' + (e['相手先・場所']||''); (g[key] = g[key] || {y, t:e['種類'], pl:e['相手先・場所']||'', nos:[], d:e['日付'], s:dateKey(e['日付'])}).nos.push(e['作品番号']); }); Object.values(g).forEach(v => put(v.y, {k:'move', o:v, s:v.s})); }
  return Y;
}
function mdate(a, b){
  const x = jd(a), y = jd(b); if (!x || !x.m) return '';
  const f = o => o.m + '.' + (o.d || '');
  const g = o => o.m + (o.d ? '.' + o.d : '');
  return g(x) + (y && y.m && g(y)!==g(x) ? '–' + g(y) : '');
}
const meta = (d, t) => `<span class="cm">${d ? `<b>${esc(d)}</b>` : ''}<span>${esc(t)}</span></span>`;
const BORN = 1923, DIED = 1998;
const ageTag = y => /^\d{4}$/.test(y) ? `<span class="cage">${+y > DIED ? '没後' + (+y - DIED) + '年' : (+y - BORN) + '歳'}</span>` : '';
const workStrip = nos => `<div class="strip">${nos.map(no => `<button class="st" data-no="${esc(no)}" aria-label="${esc(nol(no))}">${(photoBy[no]||[]).length ? thumbHTML(no,200) : esc(nol(no))}</button>`).join('')}</div>`;

/* URLを、お母さんにも分かる言葉に置き換える */
function urlLabel(raw){
  let u = String(raw || '').replace(/&amp;/g, '&'), d = u; try { d = decodeURIComponent(u); } catch (e) { }
  const cut = (s, n) => s.length > n ? s.slice(0, n) + '…' : s;
  let m;
  if (/shimomuraryonosuke\.com/.test(d)) {
    if ((m = d.match(/biography\/?[^#]*#(\d{4})(?::~:text=([^&]+))?/))) return m[2] ? `公式サイト「略歴」${m[1]}年の「${cut(m[2].split(',')[0].trim().split(/[\s　]+/)[0], 24)}」の部分を確認` : `公式サイト「略歴」の${m[1]}年のところを確認`;
    if (/biography/.test(d)) return '公式サイト「略歴」のページ';
    if (/works?|gallery/.test(d)) return '公式サイト「作品」のページ';
    return '公式サイトのページ';
  }
  if (/parismusees|cernuschi/i.test(d)) { m = d.match(/oeuvres\/([^\/?#]+)/); const t = m ? m[1].replace(/[-_]+\d*$/, '').replace(/[-_]+/g, ' ').trim() : ''; return 'パリ・セルヌスキー美術館の' + (t ? `作品ページ（${cut(t.charAt(0).toUpperCase() + t.slice(1), 30)}）` : 'ページ'); }
  if (/script\.google\.com\/macros/.test(d)) return 'このアプリのページ';
  if (/(drive|docs)\.google\.com/.test(d)) return 'Googleドライブの資料';
  if (/youtube\.com|youtu\.be/.test(d)) return 'YouTubeの動画';
  if (/wikipedia\.org/.test(d)) return 'Wikipediaのページ';
  try { return new URL(u).hostname.replace(/^www\./, '') + ' のページ'; } catch (e) { return 'リンク先のページ'; }
}

async function otUrlRead(u, force, pasted){

/* ---------- 写真のドラッグ＆ドロップ（パソコン用）：開いている画面の「写真を選ぶ」に入れる。作品ページなら「写真を追加」を開いてから入れる ---------- */
(function(){
  const vis = el => !!el && (el.offsetParent !== null || !!(el.closest('label') && el.closest('label').offsetParent !== null));
  const target = () => {
    const open = !$('#sheet').classList.contains('hidden');
    const ins = [...(open ? $('#sheetbox') : document).querySelectorAll('input[type=file][accept^="image"]')].filter(i => !i.hasAttribute('capture'));
    return ins.find(vis) || (open ? ins[0] : null) || null;
  };
  const opener = () => !$('#sheet').classList.contains('hidden') ? null : [...document.querySelectorAll('[data-act="photo"],[data-cover]')].find(b => b.offsetParent !== null) || null;
  const hasFiles = e => !!e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  let n = 0;
  const off = () => { n = 0; document.body.classList.remove('dropping'); };
  addEventListener('dragenter', e => { if (!hasFiles(e) || !canEdit() || !(target() || opener())) return; e.preventDefault(); n++; document.body.classList.add('dropping'); });
  addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = canEdit() && (target() || opener()) ? 'copy' : 'none'; });
  addEventListener('dragleave', e => { if (hasFiles(e) && --n <= 0) off(); });
  addEventListener('drop', async e => {
    if (!hasFiles(e)) return; e.preventDefault(); off();
    if (!canEdit()) return;
    let fs = [...e.dataTransfer.files].filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name));
    if (!fs.length) return alert('写真のファイルをドロップしてください');
    let inp = target();
    if (!inp) { const b = opener(); if (!b) return toast('写真を追加する画面を開いてから、ドロップしてください'); b.click(); for (let i = 0; i < 20 && !(inp = target()); i++) await new Promise(r => setTimeout(r, 100)); }
    if (!inp) return toast('写真を追加する画面を開いてから、ドロップしてください');
    if (!inp.multiple && fs.length > 1) { toast('ここでは1枚だけ入れられます（最初の1枚を使います）'); fs = fs.slice(0, 1); }
    feedFiles(inp, fs);
  });
  /* 画像のURL：サーバーで画像を受け取り、ドロップと同じ形で入れる */
  window.feedFiles = (inp, fs) => { const dt = new DataTransfer(); fs.forEach(f => dt.items.add(f)); inp.files = dt.files; inp.dispatchEvent(new Event('change', { bubbles: true })); };
  async function addByUrl(zone){
    const box = zone.querySelector('.dzurl'), u = box.value.trim();
    if (!/^https?:\/\/\S+/.test(u)) return alert('https:// から始まる画像のURLを貼ってください');
    const inp = target(); if (!inp) return;
    busy(true, '画像を受け取っています…');
    try { const r = await call('fetchImage', u); busy(false);
      const bin = atob(r.b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      box.value = ''; feedFiles(inp, [new File([arr], r.name || 'web.jpg', { type: r.mime || 'image/jpeg' })]); }
    catch(err){ busy(false); alert(String(err && err.message || err)); }
  }
  document.addEventListener('click', e => { const g = e.target.closest('.dzgo'); if (g) addByUrl(g.closest('[data-dropz]')); });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('dzurl')) { e.preventDefault(); addByUrl(e.target.closest('[data-dropz]')); } });
  document.addEventListener('paste', e => { // 画像そのものを貼り付けたとき（コピーした画像・スクリーンショット）
    const z = e.target.closest && e.target.closest('[data-dropz]'); if (!z) return;
    const fs = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => /^image\//.test(f.type)); if (!fs.length) { setTimeout(() => { if (/^https?:\/\/\S+$/.test(z.querySelector('.dzurl').value.trim())) addByUrl(z); }, 0); return; }
    e.preventDefault(); const inp = target(); if (inp) feedFiles(inp, inp.multiple ? fs : fs.slice(0, 1));
  });
})();

const MF = ['作品名','作品名メモ','幅cm','高さcm','奥行きcm','エディション','制作年','画材','仕立て','種別','シリーズ','所在区分','所在','自宅エリア','状態メモ','補足','所蔵者・連絡先','管理メモ'];
const MFN = {'作品名メモ':'作品名の補足','幅cm':'幅（cm）','高さcm':'高さ（cm）','奥行きcm':'奥行き（cm）','所在区分':'場所の区分','所在':'いまの場所','状態メモ':'状態','補足':'メモ'};
const padNo = v => { v = String(v||'').trim().replace(/^No\.?\s*/i,''); return /^\d{1,2}(-\d+)?$/.test(v) ? v.replace(/^\d+/, m => m.padStart(3,'0')) : v; };
const mgCnt = n => '写真' + (photoBy[n]||[]).length + '枚・来歴' + S.events.filter(e => e['作品番号']===n).length + '件';
function sheetMerge(no){
  const w = workOf(no); if (!w || !canEdit()) return;
  const cand = [...new Set((String(w['要確認メモ']||'') + ' ' + String(w['管理メモ']||'')).match(/\d{3}(?:-\d{1,2})?/g) || [])].filter(n => n!==no && workOf(n));
  openSheet(`<h3>統合する</h3><p class="hint">${esc(nol(no))}「${esc(w['作品名']||'無題')}」と同じ作品を選んでください</p>
    ${cand.length ? `<p class="hint" style="margin:0 0 6px">要確認メモにある候補</p><div class="mgcands">${cand.map(n => `<button type="button" class="mgcand" data-mg="${esc(n)}"><span class="mgth">${thumbHTML(n,200)}</span><span><b>${esc(nol(n))}</b>${esc(workOf(n)['作品名']||'無題')}<small>${esc(workOf(n)['制作年']||'')}　${mgCnt(n)}</small></span></button>`).join('')}</div>` : ''}
    ${F(cand.length ? 'ほかの番号を入れる' : '同じ作品の番号', inp('mgNo', '', '例：012'))}

function mergeDiff(a, b){
  const A = workOf(a), B = workOf(b); if (!A || !B) return;
  const V = (x, k) => String(x[k]||'').trim();
  const diff = MF.filter(k => V(A,k) !== V(B,k));
  const same = MF.filter(k => !diff.includes(k) && V(A,k));
  const [lo, hi] = a < b ? [a, b] : [b, a];
  const def = k => { const L = workOf(lo), H = workOf(hi); return V(L,k) ? (L===A?'a':'b') : (H===A?'a':'b'); };
  const opt = (k, side, i) => { const x = side==='a' ? A : B, n = side==='a' ? a : b, v = V(x,k), on = def(k)===side;
    return `<label class="mgopt ${on ? '' : 'off'}"><input type="checkbox" data-mgs="${side}" data-mgi="${i}" ${on ? 'checked' : ''}><span class="mgck">✓</span><span class="mgv">${v ? esc(v) : '<i>（空欄）</i>'}</span><small>${esc(nol(n))}</small></label>`; };
  openSheet(`<h3>統合する</h3><p class="hint">ちがうところを見比べて、残す方を選んでください</p>
    <div class="mgpair">${[[a,A],[b,B]].map(([n,x]) => `<div class="mgw"><div class="mgth">${thumbHTML(n,400)}</div><b>${esc(nol(n))}</b><span>${esc(x['作品名']||'無題')}</span><small>${mgCnt(n)}</small></div>`).join('')}</div>
    ${F('残す番号', pick('mgKeep', [nol(lo), nol(hi)], nol(lo)))}
    <p class="hint" style="margin-top:-6px">もう一方の番号は「統合済み」になって一覧から消えます。写真と来歴は、すべて残す番号にまとめます</p>
    <h3 class="sec" style="margin-top:22px;font-size:18px">ちがう情報（${diff.length}項目）</h3>
    <p class="hint" style="margin-top:-8px">残す方にチェック。チェックしない方には線が入ります</p>
    ${diff.length ? diff.map((k,i) => F(MFN[k]||k, `<div class="mgrow" id="mg${i}" data-m="">${opt(k,'a',i)}${opt(k,'b',i)}<div class="mgx"><button type="button" data-mgall="${i}">どちらも残す</button><button type="button" data-mgmemo="${i}">メモのみ</button></div></div>`)).join('') : '<p class="hint">ちがう情報はありません</p>'}
    ${same.length ? `<p class="hint">同じ情報：${same.map(k => esc(MFN[k]||k)).join('・')}</p>` : ''}
    <label class="mgchk"><input type="checkbox" id="mgMemo" checked> 選ばなかった情報を「管理メモ」に残す</label>
    <div class="btns"><button type="button" id="mgBack">戻る</button><button type="button" class="primary" id="mgGo">統合する</button></div>`);
  hydrate($('#sheetbox'));
  const paint = i => { const r = $('#mg'+i); r.querySelectorAll('.mgopt').forEach(l => l.classList.toggle('off', !l.querySelector('input').checked)); r.querySelector('[data-mgmemo]').classList.toggle('on', r.dataset.m==='1');
    r.querySelector('[data-mgall]').classList.toggle('on', [...r.querySelectorAll('input')].every(x => x.checked)); };
  $('#sheetbox').addEventListener('change', e => { const i = e.target.dataset.mgi; if (i===undefined) return; $('#mg'+i).dataset.m = ''; paint(i); });
  $('#sheetbox').addEventListener('click', e => { const t = e.target.closest('[data-mgall],[data-mgmemo]'); if (!t) return; const i = t.dataset.mgall ?? t.dataset.mgmemo, r = $('#mg'+i);
    if (t.dataset.mgall !== undefined) { r.querySelectorAll('input').forEach(x => x.checked = true); r.dataset.m = ''; } else { r.querySelectorAll('input').forEach(x => x.checked = false); r.dataset.m = '1'; }
    paint(i); });
  $('#mgBack').onclick = () => sheetMerge(a);
  $('#mgGo').onclick = async () => {
    const keep = val('mgKeep').replace('No.',''), drop = keep===a ? b : a;
    const patch = {}, lost = []; let forceMemo = false;
    const num = k => /cm$/.test(k);
    let bad = '';
    diff.forEach((k,i) => { const r = $('#mg'+i), ca = r.querySelector('[data-mgs="a"]').checked, cb = r.querySelector('[data-mgs="b"]').checked, memo = r.dataset.m==='1';
      const va = V(A,k), vb = V(B,k), nm = MFN[k]||k;
      if (!ca && !cb && !memo) { bad = bad || nm; return; }
      if (memo) { patch[k] = ''; [va, vb].filter(Boolean).forEach(v => lost.push(nm + '：' + v)); forceMemo = true; }
      else if (ca && cb) { if (num(k)) { patch[k] = va || vb; if (va && vb) lost.push(nm + '：' + vb); } else patch[k] = [va, vb].filter(Boolean).join(' ／ '); }
      else { patch[k] = ca ? va : vb; const o = ca ? vb : va; if (o) lost.push(nm + '：' + o); } });
    if (bad) return alert('「' + bad + '」で、残す方にチェックを入れてください（どちらも残さないときは「メモのみ」）');
    if ($('#mgMemo').checked || forceMemo) {
      const note = '【統合 ' + new Date().toLocaleDateString('ja-JP') + '】No.' + drop + ' をまとめました' + (lost.length ? '。選ばなかった情報 … ' + lost.join('／') : '');
      patch['管理メモ'] = [('管理メモ' in patch) ? patch['管理メモ'] : V(workOf(keep),'管理メモ'), note].filter(Boolean).join('\n');
    }
    if (!confirm(nol(drop) + ' を No.' + keep + ' にまとめます。よろしいですか？')) return;
    if (S.pcur && S.pcur.t==='w') S.pcur.id = keep;
    const d = await save('mergeWorks', [keep, drop, patch], '統合しました（No.' + keep + ' に集約）');
    if (d) openWork(keep, true);
  };
}

let PMIME = 'image/jpeg';
/* ---------- 裏で保存（写真）：画面はすぐ閉じて操作を続けられ、終わったら「完了しました」 ---------- */
const BGS = { n: 0 };
function bgShow(msg){ let el = $('#bgsave'); if (!el) { el = document.createElement('div'); el.id = 'bgsave'; document.body.appendChild(el); }
  el.innerHTML = BGS.n ? `<span class="ldspin"></span>${esc(msg || '写真を保存しています…')}${BGS.n > 1 ? '（' + BGS.n + '件）' : ''}` : ''; el.classList.toggle('hidden', !BGS.n); }
window.addEventListener('beforeunload', e => { if (BGS.n) { e.preventDefault(); e.returnValue = ''; } });
async function bgRun(no, job){
  BGS.n++; bgShow(); closeSheet(); toast('裏で保存しています');
  try { const r = await job(m => bgShow(m)); BGS.n--; bgShow();
    const d = r && r.works ? r : await call('getData'); setData(d); render();
    if (S.pcur && $('#sheet').classList.contains('hidden')) ({w:openWork, ex:openEx, pb:openPb, ot:openOt})[S.pcur.t](S.pcur.id, true);
    toast(r && r.dup && !r.n ? '完了しました（この写真は保存済みでした）' : '完了しました：写真を保存しました');
    return true; }
  catch(e){ BGS.n--; bgShow();
    if (isLoginErr(e)) { setToken(''); S.user=null; renderUser(); alert('ログインの有効期限が切れました。もう一度ログインしてから、写真を保存し直してください。'); openLogin(); return false; }
    if (confirm('写真を保存できませんでした（' + (e.message||e) + '）。\nもう一度送りますか？（保存済みの写真が二重になることはありません）')) return bgRun(no, job);
    return false; } }
async function savePhotos(no, list, kind, memo){
  return bgRun(no, async note => { let n = 0, dup = 0;
    for (let i = 0; i < list.length; i += 3) { note('写真を保存しています（' + Math.min(i+3, list.length) + '/' + list.length + '枚）…');
      const r = await callRetryN(note, 'addPhotos', no, list.slice(i, i+3), kind, memo); n += (r && r.n) || 0; dup += (r && r.dup) || 0; }
    return { n: n, dup: dup }; });
}
function shrink(file){ /* 長い辺を1800pxに縮めてJPEGに（透明な部分があるPNGはPNGのまま） */
  return new Promise((ok, ng) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const m = 1800, k = Math.min(1, m / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      let png = false;
      if (/png/i.test(file.type)) { try { const px = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; for (let i = 3; i < px.length; i += 4) if (px[i] < 255) { png = true; break; } } catch(e){} }
      PMIME = png ? 'image/png' : 'image/jpeg';
      ok(c.toDataURL(PMIME, 0.85).split(',')[1]); }; im.onerror = ng; im.src = r.result; };
    r.onerror = ng; r.readAsDataURL(file);
  });
}

const lgShow = h => { const w = $('#lgWall'); if (w) w.innerHTML = h.replace(/<button type="button" data-close>やめる<\/button>/,''); else openSheet(h); };
function openLogin(why){
  const inWall = !!$('#lgWall');
  lgShow(`<div class="lgf"><div class="lgwho" id="lgWho"></div><label class="lgq" for="lgIn" id="lgQ">お名前は？</label>
    <div class="lgrow"><input id="lgIn" type="search" name="smr_q" role="textbox" aria-autocomplete="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" data-lpignore="true" data-1p-ignore><button type="button" class="lggo" id="lgGo" aria-label="次へ">→</button></div>
    <div class="err" id="lgErr">${esc(why||'')}</div><button type="button" class="lgback hidden" id="lgBack">名前を入れ直す</button>${inWall ? '' : '<div class="btns"><button type="button" data-close>やめる</button></div>'}</div>`);
  const inp = $('#lgIn'), err = t => $('#lgErr').textContent = t;
  let step = 1, email = '';
  try { inp.value = localStorage.getItem('smr_name') || ''; } catch(e){}
  setTimeout(() => inp.focus(), 60);
  // どこを押しても入力できるように（iPhoneは画面に触れないとキーボードを出せないため）
  const wall = $('#lgWall'); if (wall) wall.onclick = e => { if (!e.target.closest('button,input')) inp.focus(); };
  const toName = () => { step = 1; $('#lgWho').textContent = ''; $('#lgQ').textContent = 'お名前は？'; inp.value = email; inp.setAttribute('enterkeyhint', 'next'); $('#lgBack').classList.add('hidden'); err(''); inp.focus(); };
  const submit = async () => {
    if (step === 1) {
      email = inp.value.trim(); if (!email) return err('お名前を入れてください');
      busy(true, '確認しています…');
      try {
        const r = await call('startLogin', email); if (!r.ok) return err(r.msg);
        step = 2; $('#lgWho').textContent = email + ' さん'; $('#lgQ').textContent = r.question;
        inp.value = ''; inp.setAttribute('enterkeyhint', 'done'); $('#lgBack').classList.remove('hidden'); err(''); inp.focus();
      } catch(e){ err('つながりませんでした。もう一度エンターを押してください'); }
      finally { busy(false); inp.focus(); }
    } else {
      const a = inp.value; if (!a.trim()) return err('答えを入れてください');
      busy(true, 'ログインしています…');
      try {
        const r = await call('login', email, a);
        if (!r.ok) { err(r.msg); inp.select(); return; }
        setToken(r.token); try { localStorage.setItem('smr_name', email); } catch(e){}
        inp.blur();
        const d = await call('getData'); setData(d); closeSheet(); S.view = 'home'; applyStart.done = 0; applyStart(); render();
        toast('ようこそ、' + (r.user.name || email) + 'さん');
      } catch(e){ err('つながりませんでした。もう一度エンターを押してください'); }
      finally { busy(false); }
    }
  };
  // ボタンを押してもキーボードが閉じないように、入力欄のフォーカスを保つ
  $('#lgGo').onmousedown = e => e.preventDefault();
  $('#lgGo').onclick = submit;
  inp.onkeydown = e => { if (e.key==='Enter' && !e.isComposing) { e.preventDefault(); submit(); } };
  $('#lgBack').onmousedown = e => e.preventDefault();
  $('#lgBack').onclick = toName;
}

/* ---------- 写真をまとめて取り込む（一覧の写真を最初に全部スマホへ保存して、表示を速くする） ---------- */
async function thKeys(){ const db = await THDB(); if (!db) return null; return new Promise(ok => { try { const q = db.transaction('th').objectStore('th').getAllKeys(); q.onsuccess = () => ok(new Set(q.result || [])); q.onerror = () => ok(null); } catch(e){ ok(null); } }); }
let PREF = null;
function prefetchThumbs(){
  if (PREF || !S.user) return PREF; 
  PREF = (async () => {
    try { if (navigator.connection && navigator.connection.saveData) return; } catch(e){}
    await new Promise(r => setTimeout(r, 2500)); // 画面の表示が落ち着いてから始める
    const have = await thKeys(); if (!have) return;
    const main = [...new Set([].concat(S.works.map(w => w['作品番号']), (S.others||[]).map(x => x['作品番号']))
      .map(no => (photoBy[no]||[])[0]).filter(p => p && p['ファイルID']).map(p => p['ファイルID']))];
    for (const w of [400, 200]) {                     // 一覧（中）→ 小さい写真の順
      const need = main.filter(id => !have.has(w + '_' + id) && !TH[w + '_' + id]);
      if (!need.length) continue;
      let i = 0; const CH = 40;
      const worker = async () => { while (i < need.length) { const part = need.slice(i, i += CH);
        try { const map = await call('getThumbs', part, w, CH); const keep = {};
          part.forEach(id => { const src = map[id]; if (!src) return; const k = w + '_' + id; keep[k] = src;
            document.querySelectorAll(`img[data-tid="${CSS.escape(id)}"][data-w="${w}"]:not([src])`).forEach(el => el.src = src); });
          await thPut(keep); } catch(e){ if (isLoginErr(e)) { i = need.length; } } } };
      await Promise.all([worker(), worker(), worker()]);   // 同時に3本
    }
  })();
  return PREF;
}

/* 年のボタンが上で止まっているときだけ、線より上をぼかす */
/* 年のボタン：上のボタンのすぐ下の決まった位置に「いまの年」を出しておく（スクロールで動かさない）。
   次の年のボタンが下から来て重なったら消え、次の年がその位置に来たら入れ替わる */
function markStuck(){ const fx = document.getElementById('yfix'); if (fx) fx.classList.add('hidden'); } // 年は各年の左の列で止まる（上に重ねる表示はやめた）
/* ヘッダーの「アイコン・ページ名・年」をひとつのカプセルにまとめる（後ろに1枚の背景を敷く） */
function capFit(){ const cc = document.getElementById('abCap'); if (cc) cc.remove(); return;
  const ab = document.querySelector('#top .appbar'), h = ab && ab.querySelector('h1'); if (!h) return;
  let c = document.getElementById('abCap'); if (!c) { c = document.createElement('div'); c.id = 'abCap'; ab.insertBefore(c, ab.firstChild);
    if (window.ResizeObserver) { const ro = new ResizeObserver(() => capFit()); ro.observe(h); const m = document.getElementById('btnMenu'); if (m) ro.observe(m); } }
  const hr = h.getBoundingClientRect(), ar = ab.getBoundingClientRect(); if (!hr.width) { c.style.display = 'none'; return; }
  const m = document.getElementById('btnMenu'), mr = m && getComputedStyle(m).display !== 'none' ? m.getBoundingClientRect() : null;
  const fx = document.getElementById('yfix'), y = fx && !fx.classList.contains('hidden') && getComputedStyle(fx).display !== 'none' ? fx.querySelector('.cyp') : null, yr = y ? y.getBoundingClientRect() : null;
  const l = mr && mr.width ? mr.left - 4 : hr.left, r = yr && yr.width ? yr.right : hr.right;
  c.style.display = ''; c.style.left = (l - ar.left) + 'px'; c.style.top = (hr.top - ar.top) + 'px'; c.style.width = (r - l) + 'px'; c.style.height = hr.height + 'px'; }
function markStuck0(){ const hs = [...document.querySelectorAll('#main .cyh')]; let fx = document.getElementById('yfix');
  if (!hs.length || S.view === 'home') { if (fx) fx.classList.add('hidden'); return; }
  if (!fx) { fx = document.createElement('div'); fx.id = 'yfix'; fx.className = 'hidden'; fx.innerHTML = '<div class="cyh"></div>'; document.body.appendChild(fx); }
  const t = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--stk')) || 0, H = 46;
  let cur = -1; hs.forEach((h, i) => { const r = h.getBoundingClientRect(); h.style.visibility = r.top < t - 1 ? 'hidden' : ''; if (r.top <= t + 1) cur = i; });
  const next = hs[cur + 1], nt = next ? next.getBoundingClientRect().top : Infinity;
  if (cur < 0 || window.scrollY < 5) { fx.classList.add('hidden'); return; } // 次の年はこの下に潜り込み、完全に重なった時点で入れ替わる
  const src = hs[cur], inner = fx.firstChild;
  if (inner.dataset.i !== String(cur)) { inner.innerHTML = src.innerHTML; inner.dataset.i = cur; }
  const wide = false, tb = document.querySelector('#top .appbar h1');
  fx.classList.toggle('side', wide);
  if (wide && tb) { const r = tb.getBoundingClientRect(); fx.style.top = r.top + 'px'; fx.style.setProperty('--abh', r.height + 'px'); inner.style.setProperty('padding-left', r.right + 'px', 'important'); } // パソコン：ページ名の右に並べる
  else { fx.style.top = t + 'px'; inner.style.setProperty('padding-left', Math.max(0, src.getBoundingClientRect().left) + 'px', 'important'); }
  src.style.visibility = 'hidden'; fx.classList.remove('hidden'); }
function hdStick(){ const hd = document.getElementById('top'), ab = hd && hd.querySelector('.appbar'); if (!hd || !ab) return;
  const rows = [...hd.querySelectorAll('#finder:not(.hidden) .chips:not(.hidden), #chronobar:not(.hidden) .chips')].filter(x => x.offsetParent);
  const last = rows[rows.length - 1];
  hd.querySelectorAll('.chips.stk').forEach(x => { if (x !== last) x.classList.remove('stk'); }); if (last) last.classList.add('stk');
  const tuck = hd.classList.contains('tuck') && !document.body.classList.contains('pgopen'), cs = getComputedStyle(document.documentElement);
  let pr = document.getElementById('safeProbe'); if (!pr) { pr = document.createElement('div'); pr.id = 'safeProbe'; pr.style.cssText = 'position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;height:calc(var(--tb,0px) + var(--cap,0px))'; document.body.appendChild(pr); }
  const safe = pr.offsetHeight; // 画面上の切り欠きの高さ（実際の長さで測る）
  const abb = ab.offsetTop + ab.offsetHeight, top = tuck ? safe : abb;
  document.documentElement.style.setProperty('--abb', abb + 'px'); document.documentElement.style.setProperty('--safe', safe + 'px');
  if (!document.getElementById('safeCover')) { const sc = document.createElement('div'); sc.id = 'safeCover'; document.body.appendChild(sc); }
  document.documentElement.style.setProperty('--rowtop', top + 'px'); document.documentElement.style.setProperty('--rowh', (last ? last.offsetHeight : 0) + 'px');
  return last ? top + last.offsetHeight : top; }
function stkTop(){ let hb = 0; try { hb = hdStick() || 0; } catch(e){} const ab = document.querySelector('#top .appbar'); const b = hb ? hb + 6 : (ab ? Math.max(0, ab.getBoundingClientRect().bottom + 6) : 0); document.documentElement.style.setProperty('--stk', b + 'px'); document.documentElement.style.setProperty('--stkx', '0px');  markStuck(); }
window.addEventListener('resize', () => stkTop());
function wtTop(){ const h = $('#wthd'); if (!h) return; const ab = document.querySelector('#top .appbar'); h.style.top = (ab ? Math.max(0, ab.getBoundingClientRect().bottom + 6) : 0) + 'px'; h.style.paddingTop = '0px'; }
addEventListener('scroll', () => { if ($('#wthd')) requestAnimationFrame(wtTop); }, {passive:true});

/* ---------- AIチャット（画面の上に吹き出しで開く） ---------- */
const newConv = () => new Date().toISOString().replace(/\D/g, '').slice(0, 14) + '-' + Math.random().toString(36).slice(2, 6);
function openAI(){
  if (!S.user) return openLogin('質問するにはログインしてください');
  const p = $('#aip'); if (!p.contains($('#askbar'))) p.appendChild($('#askbar'));
  $('#askbar').classList.remove('hidden'); p.classList.remove('hidden'); S.aiOpen = true; navOn(); document.body.classList.add('aiopen'); aiColSync();
  renderAI();
  if (!S.aiLoaded) { S.aiLoaded = true; call('getAIHistory').then(h => { if (S.chat.length || !h || !h.items || !h.items.length) { if (!S.conv) S.conv = newConv(); return; }
      S.conv = h.conv || newConv(); S.chat = [].concat(...h.items.map(r => [{role:'user', text:r.q, t:String(r.t||'').slice(11,16)}, {role:'ai', text:r.a, t:String(r.t||'').slice(11,16)}])); if (S.aiOpen) renderAI(); })
    .catch(() => { if (!S.conv) S.conv = newConv(); }); }

}

/* ---------- スマホ：カード型の作品リスト（表の情報を3〜4行にまとめる） ---------- */
function mcard(w){
  const no = w['作品番号'], lk = lacks(w), q = (k, v, t) => v ? esc(v) : (lk.includes(k) ? `<span class="lack">${t}？</span>` : '');
  const sz = (w['幅cm']||w['高さcm']||w['奥行きcm']) ? esc(dimTxt(w, false, 'cm')).replace(/ /g, '') : '<span class="lack">サイズ？</span>';
  const l2 = [q('制作年', w['制作年'], '年'), sz, q('画材', w['画材'], '画材'), q('種別', w['種別'], '種別')].filter(Boolean).join('<i>｜</i>');
  const kind = w['所在区分'], pl = [w['所在'], w['自宅エリア'] && !String(w['所在']||'').includes(w['自宅エリア']) ? 'エリア' + w['自宅エリア'] : ''].filter(Boolean).join(' ').replace(new RegExp('^' + (kind||'#') + '\\s*'), '');
  const loc = kind && kind!=='不明' ? `<span class="mloc">${esc(kind)}</span><span class="mpl">${esc(pl && pl!==kind ? pl : '')}</span>` : '<span class="lack">場所？</span>';
  const E = eventBy[no]||[], nx = E.filter(e => e['展覧会ID']).length, np = E.filter(e => e['資料ID']).length, nph = (photoBy[no]||[]).length;
  const cnt = [nph ? '写真' + nph : '<span class="lack">写真なし</span>', nx ? '展覧会' + nx : '', np ? '画集' + np : ''].filter(Boolean).join('・');
  return `<button class="row mc" data-no="${esc(no)}"><div class="mnoc">${esc(no)}</div>
    <div class="thumb">${nph ? thumbHTML(no, 200) : ''}</div>
    <div class="body">
      <div class="mc1"><span class="mtt">${w['作品名'] ? esc(w['作品名']) : '<span class="lack">無題</span>'}</span>${w['場所確認日'] ? '<span class="mck" title="場所を確認済み">✓</span>' : ''}</div>
      <div class="mc2">${l2}</div>
      <div class="mc3">${loc}<span class="mcn">${cnt}</span></div>
      ${w['要確認'] ? `<div class="mc4"><span class="mflag">要確認</span>${esc(w['要確認メモ']||'')}</div>` : ''}
    </div></button>`;
}
